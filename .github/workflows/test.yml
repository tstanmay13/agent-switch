name: Offline tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python agent_switch.py test
      - name: Windows installer and command smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          agent-switch test
          agent-switch --help
